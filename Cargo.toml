[package]
name = "aqualux-rs"
version = "1.0.0"
edition = "2024"
description = "Cross-platform Rust reimplementation of the Aqualux pipe-puzzle game"
license = "GPL-3.0-or-later"
repository = "https://github.com/ddavef/aqualux-rs"

[dependencies]
winit = "0.30"
wgpu = "24"
pollster = "0.4"
flate2 = "1"
jpeg-decoder = "0.3"
image = { version = "0.25", default-features = false, features = [
    "png",
    "rayon",
] }
roxmltree = "0.20"
rayon = "1.12"
rustc-hash = "2.1"
bytemuck = { version = "1.25", features = ["derive"] }
rodio = { version = "0.20", default-features = false, features = [
    "symphonia-mp3",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
rand = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
