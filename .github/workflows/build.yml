name: Build

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build (defaults to the branch selected in 'Use workflow from')"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      version:
        description: "Version string used in release archive filenames"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: i686-unknown-linux-gnu
            platform: linux-x86
            bin: aqualux-rs
            ext: tar.gz
            deb_arch: i386
            gcc_pkg: gcc-i686-linux-gnu
            linker: i686-linux-gnu-gcc
            lib_dir: /usr/lib/i386-linux-gnu
            env_target: I686_UNKNOWN_LINUX_GNU
            cc_target: i686_unknown_linux_gnu
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            bin: aqualux-rs
            ext: tar.gz
          - os: ubuntu-24.04
            target: armv7-unknown-linux-gnueabihf
            platform: linux-arm32
            bin: aqualux-rs
            ext: tar.gz
            deb_arch: armhf
            gcc_pkg: gcc-arm-linux-gnueabihf
            linker: arm-linux-gnueabihf-gcc
            lib_dir: /usr/lib/arm-linux-gnueabihf
            env_target: ARMV7_UNKNOWN_LINUX_GNUEABIHF
            cc_target: armv7_unknown_linux_gnueabihf
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64
            bin: aqualux-rs
            ext: tar.gz
            deb_arch: arm64
            gcc_pkg: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc
            lib_dir: /usr/lib/aarch64-linux-gnu
            env_target: AARCH64_UNKNOWN_LINUX_GNU
            cc_target: aarch64_unknown_linux_gnu
          - os: windows-latest
            target: i686-pc-windows-msvc
            platform: windows-x86
            bin: aqualux-rs.exe
            ext: zip
            msvc_arch: amd64_x86
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            bin: aqualux-rs.exe
            ext: zip
            msvc_arch: amd64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            platform: windows-arm64
            bin: aqualux-rs.exe
            ext: zip
            msvc_arch: amd64_arm64
          - os: macos-15
            target: x86_64-apple-darwin
            platform: macos-x86_64
            bin: aqualux-rs
            ext: tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            platform: macos-arm64
            bin: aqualux-rs
            ext: tar.gz

    env:
      ARCHIVE_NAME: ${{ inputs.version != '' && format('aqualux-rs-{0}-{1}.{2}', inputs.version, matrix.platform, matrix.ext) || format('aqualux-rs-{0}.{1}', matrix.platform, matrix.ext) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Install Linux native dependencies
        if: runner.os == 'Linux' && !matrix.deb_arch
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev

      - name: Install Linux cross-compilation dependencies
        if: runner.os == 'Linux' && matrix.deb_arch
        shell: bash
        run: |
          mkdir -p /tmp/cross-sources
          cat <<'EOF' > /tmp/cross-sources/ubuntu.sources
          Types: deb
          URIs: http://archive.ubuntu.com/ubuntu
          Suites: noble noble-updates noble-backports
          Components: main restricted universe multiverse
          Architectures: amd64 i386
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: http://security.ubuntu.com/ubuntu
          Suites: noble-security
          Components: main restricted universe multiverse
          Architectures: amd64 i386
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: noble noble-updates noble-backports noble-security
          Components: main restricted universe multiverse
          Architectures: arm64 armhf
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF

          sudo dpkg --add-architecture "${{ matrix.deb_arch }}"
          sudo apt-get -o Dir::Etc::sourcelist=/dev/null -o Dir::Etc::sourceparts=/tmp/cross-sources update
          sudo apt-get -o Dir::Etc::sourcelist=/dev/null -o Dir::Etc::sourceparts=/tmp/cross-sources install -y --no-install-recommends \
            pkg-config \
            "${{ matrix.gcc_pkg }}" \
            "libasound2-dev:${{ matrix.deb_arch }}"

          {
            echo "PKG_CONFIG_ALLOW_CROSS=1"
            echo "PKG_CONFIG_PATH=${{ matrix.lib_dir }}/pkgconfig"
            echo "CC_${{ matrix.cc_target }}=${{ matrix.linker }}"
            echo "CARGO_TARGET_${{ matrix.env_target }}_LINKER=${{ matrix.linker }}"
            echo "CARGO_TARGET_${{ matrix.env_target }}_RUSTFLAGS=-L ${{ matrix.lib_dir }} -C link-arg=-Wl,-rpath-link,${{ matrix.lib_dir }}"
          } >> "$GITHUB_ENV"

      - name: Set up Windows MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package release archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          rm -rf dist
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" LICENSE README.md dist/
          tar -czf "${ARCHIVE_NAME}" -C dist .

      - name: Package release archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path dist) { Remove-Item -Recurse -Force dist }
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin }}", "LICENSE", "README.md" -Destination dist/
          Compress-Archive -Path dist/* -DestinationPath $env:ARCHIVE_NAME -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: aqualux-rs-${{ matrix.platform }}
          path: ${{ env.ARCHIVE_NAME }}
          if-no-files-found: error
