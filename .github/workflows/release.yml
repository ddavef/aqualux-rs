name: Release

on:
  push:
    tags:
      - 'v[0-9]*.*.*'

permissions:
  contents: write

jobs:
  verify-tag:
    name: Verify tag is on main branch
    runs-on: ubuntu-24.04
    outputs:
      on_main: ${{ steps.check.outputs.on_main }}
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if tagged commit is on main branch
        id: check
        shell: bash
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "on_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Skipping release: tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on the main branch."
            echo "on_main=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build Release Matrix
    needs: verify-tag
    if: needs.verify-tag.outputs.on_main == 'true'
    uses: ./.github/workflows/build.yml

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs: [verify-tag, build]
    if: needs.verify-tag.outputs.on_main == 'true'
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package release archives and checksums
        shell: bash
        run: |
          mkdir -p release-assets
          for dir in artifacts/aqualux-rs-*; do
            platform="${dir#artifacts/aqualux-rs-}"
            archive_base="aqualux-rs-${GITHUB_REF_NAME}-${platform}"
            if [[ "${platform}" == windows-* ]]; then
              (cd "$dir" && zip -q -r "../../release-assets/${archive_base}.zip" .)
            else
              chmod +x "$dir/aqualux-rs"
              tar -czf "release-assets/${archive_base}.tar.gz" -C "$dir" .
            fi
          done
          (cd release-assets && sha256sum aqualux-rs-* > SHA256SUMS.txt)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          prerelease_flag=""
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            prerelease_flag="--prerelease"
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            ${prerelease_flag} \
            release-assets/*
